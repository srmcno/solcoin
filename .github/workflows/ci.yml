name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # better-sqlite3 ships prebuilds for the runner's platform; `npm ci`
      # keeps the lockfile authoritative rather than resolving fresh ranges.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The suite is offline by design: every provider is faked or runs
      # against the simulation adapter, so a flaky network cannot redden CI.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # A migration that does not apply to an empty database is a deploy-time
      # failure, which is the worst time to find one.
      - name: Migrate a fresh database
        run: npm run db:migrate
        env:
          DATABASE_PATH: ./data/ci-check.db

      # The unit tests import modules; they do not run the artefact that ships.
      # A bundled server can typecheck, build and test perfectly and still die
      # on boot — that is exactly how the pino worker-transport bug behaved, so
      # this starts the real bundle and waits for it to serve a request.
      # The wizard promises hidden input. Verifying that needs a real pty on
      # stdin: readline redraws keystrokes that raw mode stopped the driver
      # from echoing, and the leak simply does not occur when answers arrive
      # from a pipe — so a check driven any other way passes while every
      # credential and pasted private key is printed to the screen.
      - name: The setup wizard must not echo secrets
        run: python3 scripts/check-no-secret-echo.py

      - name: Boot the built server from another directory
        # Deliberately not run from the repository root. The bundle resolves its
        # migrations from paths relative to itself and to the working directory,
        # and a missing relative candidate meant `dist/main.js` found them only
        # when cwd happened to be the root — so every deployment with a
        # different WorkingDirectory died on boot with "Can't find
        # meta/_journal.json" while this step stayed green. Booting from
        # somewhere else is what makes this check cover the real deployment.
        run: |
          set -euo pipefail
          repo="$PWD"
          mkdir -p "$RUNNER_TEMP/boot" && cd "$RUNNER_TEMP/boot"
          node "$repo/packages/server/dist/main.js" &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4317/api/health > /dev/null; then
              echo "server answered after ${i}s"
              exit 0
            fi
            if ! kill -0 "$server" 2>/dev/null; then
              echo "server exited before serving a request" >&2
              exit 1
            fi
            sleep 1
          done
          echo "server never answered /api/health" >&2
          exit 1
        env:
          DATABASE_PATH: ./data/ci-check.db
          DATA_DIR: ./data
          SOLCOIN_MASTER_KEY: ci-only-not-a-real-key-0123456789
