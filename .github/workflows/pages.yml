name: Deploy project site

# The site under site/ is plain HTML and CSS with no build step, so this only
# has to publish the directory.
#
# Two jobs rather than one, and the split is load-bearing. `environment:` is
# evaluated before a job's first step runs, so a job that both enables Pages
# and declares `environment: github-pages` can never succeed on a repository
# where Pages has not been enabled yet: it is rejected before the step that
# would have enabled it. Enabling happens here in a job with no environment,
# and only the deploy job — which by then has a valid environment — declares it.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy that is already publishing; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tries to enable Pages, which works when the workflow token is allowed to.
      # It frequently is not: creating a Pages site for the first time is an
      # owner-level action, and the token gets "Resource not accessible by
      # integration" however `pages: write` is declared. The step below turns
      # that opaque failure into an instruction, because the fix is one setting
      # and the error does not say so.
      - name: Enable Pages and read its settings
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Explain what to do if Pages is not enabled
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error title=GitHub Pages is not enabled::This workflow cannot enable it for you."
          cat <<'MSG'

          Pages could not be enabled from CI. Creating a Pages site for the first
          time needs a repository owner, and the workflow token is refused with
          "Resource not accessible by integration" no matter what permissions the
          workflow declares.

          Enable it once, by hand:

            Settings -> Pages -> Build and deployment -> Source: GitHub Actions

          Then re-run this workflow. Nothing else needs to change, and no later
          run needs this step to do anything.

          If the Source dropdown is missing, check
          Settings -> Actions -> General -> Workflow permissions
          is set to "Read and write permissions".

          MSG
          exit 1

      - name: Check every local link resolves
        # A published page with a dead stylesheet or a broken anchor is the
        # static-site version of a button that does nothing.
        run: |
          cd site
          status=0
          for href in $(grep -oE '(href|src)="\./[^"]+"' index.html | sed -E 's/.*"\.\/(.*)"/\1/' | sort -u); do
            if [ ! -f "$href" ]; then echo "missing asset: $href"; status=1; fi
          done
          for anchor in $(grep -oE 'href="#[a-z-]+"' index.html | sed -E 's/href="#(.*)"/\1/' | sort -u); do
            if ! grep -q "id=\"$anchor\"" index.html; then echo "dead anchor: #$anchor"; status=1; fi
          done
          exit $status

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
